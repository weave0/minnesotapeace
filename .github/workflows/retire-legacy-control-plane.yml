name: Retire legacy Jamie control plane

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/retire-legacy-control-plane.yml'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEGACY_BUILD_TAG: f0f38a9cf0bd4111a5029d94f813d284
      LEGACY_DOMAIN: mediation.globaldeets.com
      PAGES_PROJECT: minnesotapeace
    steps:
      - name: Verify MN Peace project before cleanup
        run: |
          set -euo pipefail
          json=$(curl -fsS \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}")
          python3 - "$json" <<'PY'
          import json, sys
          d=json.loads(sys.argv[1])
          assert d.get('success'), d
          r=d['result']
          domains=set(r.get('domains') or [])
          assert 'minnesotapeace.com' in domains, domains
          assert 'www.minnesotapeace.com' in domains, domains
          print('Verified live MN Peace Pages project:', r.get('name'))
          print('Current domains:', ', '.join(sorted(domains)))
          PY

      - name: Detach obsolete Worker build configuration
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/builds/workers/${LEGACY_BUILD_TAG}"
          code=$(curl -sS -o /tmp/delete-build.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer ${CF_API_TOKEN}" "$url")
          cat /tmp/delete-build.json
          if [ "$code" != "200" ] && [ "$code" != "404" ]; then
            echo "Unexpected HTTP $code deleting obsolete build configuration" >&2
            exit 1
          fi

      - name: Remove retired mediation alias from MN Peace
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}/domains/${LEGACY_DOMAIN}"
          code=$(curl -sS -o /tmp/delete-domain.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer ${CF_API_TOKEN}" "$url")
          cat /tmp/delete-domain.json
          if [ "$code" != "200" ] && [ "$code" != "404" ]; then
            echo "Unexpected HTTP $code deleting retired mediation alias" >&2
            exit 1
          fi

      - name: Verify cleanup without touching production domains
        run: |
          set -euo pipefail
          build_code=$(curl -sS -o /tmp/build-check.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/builds/workers/${LEGACY_BUILD_TAG}")
          if [ "$build_code" != "404" ]; then
            echo "Obsolete Worker build configuration still exists (HTTP $build_code)" >&2
            cat /tmp/build-check.json >&2
            exit 1
          fi

          json=$(curl -fsS \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}")
          python3 - "$json" <<'PY'
          import json, sys
          d=json.loads(sys.argv[1])
          assert d.get('success'), d
          domains=set(d['result'].get('domains') or [])
          assert 'minnesotapeace.com' in domains, domains
          assert 'www.minnesotapeace.com' in domains, domains
          assert 'mediation.globaldeets.com' not in domains, domains
          print('Cleanup verified. Production domains preserved:', ', '.join(sorted(domains)))
          PY
