name: Backfill canonical social metadata

on:
  push:
    branches:
      - agent/backfill-social-metadata-2026-08-28
    paths:
      - '.github/workflows/backfill-social-metadata.yml'

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/backfill-social-metadata-2026-08-28

      - name: Normalize canonical public metadata
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('index.html'),
              Path('record/index.html'),
              Path('status/index.html'),
              Path('good/index.html'),
              Path('guide/index.html'),
              Path('oversight/index.html'),
          ]
          old = 'https://minnesotapeace.com/assets/og/mn-peace-og.jpg'
          new = 'https://minnesotapeace.com/assets/og/mn-peace-og-v2.png'
          alt = 'MN Peace editorial card with a geometric Minnesota monogram and cyan-and-gold evidence lines'

          for path in files:
              text = path.read_text(encoding='utf-8')
              text = text.replace(old, new)
              text = re.sub(
                  r'<meta property="og:image:alt" content="[^"]*">',
                  f'<meta property="og:image:alt" content="{alt}">',
                  text,
              )

              og = f'<meta property="og:image" content="{new}">'
              if og not in text:
                  raise SystemExit(f'{path}: expected og:image not found')

              if 'property="og:image:secure_url"' not in text:
                  text = text.replace(
                      og,
                      og + f'\n  <meta property="og:image:secure_url" content="{new}">\n  <meta property="og:image:type" content="image/png">',
                      1,
                  )

              if 'name="twitter:image"' not in text:
                  marker = '<meta name="twitter:card" content="summary_large_image">'
                  if marker not in text:
                      raise SystemExit(f'{path}: twitter card marker missing')
                  text = text.replace(marker, marker + f'\n  <meta name="twitter:image" content="{new}">', 1)
              else:
                  text = re.sub(
                      r'<meta name="twitter:image" content="[^"]*">',
                      f'<meta name="twitter:image" content="{new}">',
                      text,
                  )

              if 'name="twitter:image:alt"' not in text:
                  marker = f'<meta name="twitter:image" content="{new}">'
                  text = text.replace(marker, marker + f'\n  <meta name="twitter:image:alt" content="{alt}">', 1)

              if 'name="robots"' not in text:
                  desc = re.search(r'<meta name="description" content="[^"]*">', text)
                  if not desc:
                      raise SystemExit(f'{path}: description metadata missing')
                  text = text[:desc.end()] + '\n  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">' + text[desc.end():]

              path.write_text(text, encoding='utf-8')

          for path in files:
              text = path.read_text(encoding='utf-8')
              assert old not in text, path
              assert new in text, path
              assert 'og:image:secure_url' in text, path
              assert 'og:image:type' in text, path
              assert 'twitter:image:alt' in text, path
              assert 'max-image-preview:large' in text, path
          PY

          git diff --check
          if grep -RIn --include='*.html' 'mn-peace-og.jpg' index.html record status good guide oversight; then
            echo 'Retired OG URL remains in canonical public HTML.' >&2
            exit 1
          fi

      - name: Commit canonical metadata back to branch
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No metadata changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html record/index.html status/index.html good/index.html guide/index.html oversight/index.html
          git commit -m 'Backfill canonical MN Peace social metadata'
          git push origin HEAD:agent/backfill-social-metadata-2026-08-28
