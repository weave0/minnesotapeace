name: Brand integrity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject stale branding and internal publication copy
        run: |
          set -euo pipefail

          public_html=(
            index.html
            record/index.html
            status/index.html
            good/index.html
            guide/index.html
            oversight/index.html
            programs/index.html
            money/index.html
            authority/index.html
          )
          public_discovery=(
            js/discovery.js
            js/discovery-v5.js
            js/discovery-v6.js
            js/discovery-v7.js
          )

          if grep -RniE \
            --include='*.html' \
            --include='*.xml' \
            --include='*.js' \
            'Jamie[[:space:]]+Rigling|Family Law Mediation|Rule 114 certified mediator' \
            index.html record status good guide oversight programs money authority functions; then
            echo 'Legacy Jamie Rigling branding leaked into the MN Peace publication.' >&2
            exit 1
          fi

          if grep -niE \
            'global-reader|U\.S\. criminal procedure uses words that sound similar|almost every case update|internal copy|Later, not now|Editorial, not a vibe' \
            "${public_html[@]}" "${public_discovery[@]}"; then
            echo 'Internal/editorial scaffold leaked into visitor-facing publication copy.' >&2
            exit 1
          fi

          test -f assets/og/mn-peace-og-v2.png
          test -f js/discovery-v7.js

          if [ -e assets/og/mn-peace-og.jpg ]; then
            echo 'Legacy OG binary must not return to the repository.' >&2
            exit 1
          fi

          if grep -nF 'https://minnesotapeace.com/assets/og/mn-peace-og.jpg' "${public_html[@]}" sitemap.xml; then
            echo 'Canonical publication metadata still references the retired OG URL.' >&2
            exit 1
          fi

          grep -Fq 'https://minnesotapeace.com/assets/og/mn-peace-og-v2.png' sitemap.xml

          for page in "${public_html[@]}"; do
            grep -Fq 'https://minnesotapeace.com/assets/og/mn-peace-og-v2.png' "$page"
            grep -Fq 'property="og:image:width" content="1200"' "$page"
            grep -Fq 'property="og:image:height" content="630"' "$page"
            grep -Fq 'property="og:image:type" content="image/png"' "$page"
            grep -Fq 'property="og:image:alt"' "$page"
            grep -Fq 'name="twitter:title"' "$page"
            grep -Fq 'name="twitter:description"' "$page"
            grep -Fq 'name="twitter:image" content="https://minnesotapeace.com/assets/og/mn-peace-og-v2.png"' "$page"
            grep -Fq 'name="twitter:image:alt"' "$page"
            grep -Fq 'max-image-preview:large' "$page"
          done

          grep -Fq 'https://minnesotapeace.com/programs/' sitemap.xml
          grep -Fq 'https://minnesotapeace.com/money/' sitemap.xml
          grep -Fq 'https://minnesotapeace.com/authority/' sitemap.xml
          grep -Fq '/js/discovery-v7.js' functions/_middleware.js

          # The retired URL remains only as an edge migration rule so old cached links resolve cleanly.
          grep -Fq 'https://minnesotapeace.com/assets/og/mn-peace-og-v2.png' functions/_middleware.js
          grep -Fq 'https://minnesotapeace.com/assets/og/mn-peace-og.jpg' functions/_middleware.js
          grep -Fq '/assets/og/mn-peace-og.jpg  /assets/og/mn-peace-og-v2.png  301' _redirects
