name: Deploy to Cloudflare Pages

# Cloudflare Pages project `minnesotapeace` deploys from `main`.
# research/ stays in git as the lab and is never copied into the Pages artifact.

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            deployments: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Assemble and validate public site
              run: |
                  set -euo pipefail
                  mkdir -p public
                  cp _headers _redirects index.html 404.html robots.txt sitemap.xml favicon.svg public/
                  cp -a css js assets record status good guide oversight public/
                  mkdir -p public/functions
                  cp -a functions/. public/functions/

                  test -f public/index.html
                  test -f public/css/publication.css
                  test -f public/css/deepdive.css
                  test -f public/css/discovery.css
                  test -f public/css/status.css
                  test -f public/css/good.css
                  test -f public/js/discovery.js
                  test -f public/js/discovery-v5.js
                  test -f public/status/index.html
                  test -f public/good/index.html
                  test -f public/guide/index.html
                  test -f public/oversight/index.html
                  test -f public/_headers
                  test -f public/_redirects
                  test -f public/record/index.html
                  test -f public/record/js/viewer.js
                  test -f public/record/js/briefs.js
                  test -f public/record/css/viewer.css
                  test -f public/record/css/context.css
                  test -f public/record/css/briefs.css
                  test -f public/record/data/corpus.js
                  test -f public/record/data/stats.js
                  test -f public/record/documents/25-cr-00349-ecf1.pdf
                  test -f public/functions/_middleware.js

                  if [ -e public/research ] || [ -e public/.git ] || [ -e public/.github ]; then
                    echo "lab paths leaked into the public artifact" >&2
                    exit 1
                  fi

                  if grep -R -n --include='*.html' --include='*.xml' -E '(href|src)="/research/' public; then
                    echo "public artifact still points at /research/" >&2
                    exit 1
                  fi

                  if grep -n -E 'CHARGED_ALLEGED|metric_type|overlap_group|Actor classes|v1 records|corpus bundle|Later, not now|Editorial, not a vibe' public/index.html public/record/index.html public/status/index.html public/good/index.html public/guide/index.html public/oversight/index.html; then
                    echo "internal research vocabulary leaked into visitor-facing HTML" >&2
                    exit 1
                  fi

                  grep -Fq 'What happened' public/index.html
                  grep -Fq 'The story in 90 seconds' public/index.html
                  grep -Fq 'How the systems worked' public/index.html
                  grep -Fq 'Where things stand' public/index.html
                  grep -Fq 'Where do the cases actually stand now?' public/status/index.html
                  grep -Fq '78' public/status/index.html
                  grep -Fq '68' public/status/index.html
                  grep -Fq '26' public/status/index.html
                  grep -Fq 'Minnesota is more than what went wrong.' public/good/index.html
                  grep -Fq 'What was the money for?' public/good/index.html
                  grep -Fq 'No formal DFL electoral organizations' public/good/index.html
                  grep -Fq 'Minnesota Young Republicans' public/good/index.html
                  grep -Fq 'Minnesota Chiefs of Police Foundation' public/good/index.html
                  grep -Fq 'Who is who' public/guide/index.html
                  grep -Fq 'Court language' public/guide/index.html
                  grep -Fq 'The fraud story is only half the story.' public/oversight/index.html
                  grep -Fq 'Legislative Auditor' public/oversight/index.html
                  grep -Fq 'Evidence room' public/record/index.html
                  grep -Fq '/record/js/briefs.js' public/record/index.html
                  grep -Fq 'Start with a case, not a data table.' public/record/js/briefs.js
                  grep -Fq 'What prosecutors allege in this filing' public/record/js/briefs.js
                  grep -Fq 'context-first-v5.1' public/functions/_middleware.js
                  grep -Fq '/js/discovery-v5.js' public/functions/_middleware.js
                  grep -Fq '78 defendants had been charged' public/functions/_middleware.js
                  grep -Fq 'Minnesotans helping Minnesotans' public/js/discovery-v5.js

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy public --project-name minnesotapeace --branch main

            - name: Purge Cloudflare cache if permitted
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: |
                  set -euo pipefail
                  ZONE_JSON=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                    "https://api.cloudflare.com/client/v4/zones?name=minnesotapeace.com")
                  ZONE_ID=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); r=d.get("result") or []; print(r[0]["id"] if r else "")' "$ZONE_JSON")
                  if [ -z "$ZONE_ID" ]; then
                    echo "No zone id; cache purge permission unavailable. Public HTML is no-store, so continuing."
                    exit 0
                  fi
                  PURGE_JSON=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
                    -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                    -H "Content-Type: application/json" \
                    --data '{"purge_everything":true}')
                  PURGE_OK=$(python3 -c 'import json,sys; print("true" if json.loads(sys.argv[1]).get("success") else "false")' "$PURGE_JSON")
                  if [ "$PURGE_OK" != "true" ]; then
                    echo "Cloudflare cache purge was not permitted. Public HTML is no-store; exact-origin verification will decide deployment health."
                  fi

            - name: Verify exact public URLs serve the publication build
              run: |
                  set -euo pipefail

                  check_text() {
                    file="$1"
                    needle="$2"
                    label="$3"
                    if ! grep -Fq "$needle" "$file"; then
                      echo "VERIFY MISS: $label did not contain: $needle" >&2
                      return 1
                    fi
                  }

                  check_header() {
                    file="$1"
                    pattern="$2"
                    label="$3"
                    if ! grep -Eqi "$pattern" "$file"; then
                      echo "VERIFY HEADER MISS: $label did not match: $pattern" >&2
                      return 1
                    fi
                  }

                  ok=0
                  for attempt in 1 2 3 4 5 6; do
                    rm -f /tmp/home.html /tmp/record.html /tmp/status.html /tmp/good.html /tmp/guide.html /tmp/oversight.html /tmp/briefs.js /tmp/discovery-v5.js
                    rm -f /tmp/home.headers /tmp/record.headers /tmp/status.headers /tmp/good.headers /tmp/guide.headers /tmp/oversight.headers

                    curl -fsSL -D /tmp/home.headers -H 'Cache-Control: no-cache' -o /tmp/home.html "https://minnesotapeace.com/" || true
                    curl -fsSL -D /tmp/record.headers -H 'Cache-Control: no-cache' -o /tmp/record.html "https://minnesotapeace.com/record/" || true
                    curl -fsSL -D /tmp/status.headers -H 'Cache-Control: no-cache' -o /tmp/status.html "https://minnesotapeace.com/status/" || true
                    curl -fsSL -D /tmp/good.headers -H 'Cache-Control: no-cache' -o /tmp/good.html "https://minnesotapeace.com/good/" || true
                    curl -fsSL -D /tmp/guide.headers -H 'Cache-Control: no-cache' -o /tmp/guide.html "https://minnesotapeace.com/guide/" || true
                    curl -fsSL -D /tmp/oversight.headers -H 'Cache-Control: no-cache' -o /tmp/oversight.html "https://minnesotapeace.com/oversight/" || true
                    curl -fsSL -H 'Cache-Control: no-cache' -o /tmp/briefs.js "https://minnesotapeace.com/record/js/briefs.js" || true
                    curl -fsSL -H 'Cache-Control: no-cache' -o /tmp/discovery-v5.js "https://minnesotapeace.com/js/discovery-v5.js" || true

                    misses=0
                    check_text /tmp/home.html 'What happened' 'homepage' || misses=1
                    check_text /tmp/home.html 'status-value">78<' 'homepage current charged milestone' || misses=1
                    check_text /tmp/home.html '/js/discovery-v5.js' 'homepage discovery injection' || misses=1
                    check_text /tmp/status.html 'Where do the cases actually stand now?' 'status desk' || misses=1
                    check_text /tmp/status.html '78th defendant charged' 'status desk charged source' || misses=1
                    check_text /tmp/good.html 'Minnesota is more than what went wrong.' 'civic good-work page' || misses=1
                    check_text /tmp/good.html 'No formal DFL electoral organizations' 'civic scope disclosure' || misses=1
                    check_text /tmp/guide.html 'Who is who' 'field guide' || misses=1
                    check_text /tmp/oversight.html 'The fraud story is only half the story.' 'oversight' || misses=1
                    check_text /tmp/record.html 'Evidence room' 'record' || misses=1
                    check_text /tmp/record.html '/record/js/briefs.js' 'record briefs asset' || misses=1
                    check_text /tmp/record.html '/js/discovery-v5.js' 'record discovery injection' || misses=1
                    check_text /tmp/briefs.js 'Start with a case, not a data table.' 'briefs JS' || misses=1
                    check_text /tmp/discovery-v5.js 'Minnesotans helping Minnesotans' 'versioned discovery JS' || misses=1
                    check_header /tmp/home.headers '^x-mnpeace-publication: context-first-v5\.1' 'homepage version' || misses=1
                    check_header /tmp/home.headers '^cache-control: .*no-store' 'homepage cache' || misses=1
                    check_header /tmp/status.headers '^cache-control: .*no-store' 'status cache' || misses=1
                    check_header /tmp/good.headers '^cache-control: .*no-store' 'civic page cache' || misses=1
                    check_header /tmp/guide.headers '^cache-control: .*no-store' 'guide cache' || misses=1
                    check_header /tmp/oversight.headers '^cache-control: .*no-store' 'oversight cache' || misses=1

                    if [ "$misses" -eq 0 ]; then
                      ok=1
                      break
                    fi
                    echo "Exact-origin verification attempt ${attempt} did not pass; retrying." >&2
                    sleep 5
                  done

                  if [ "$ok" -ne 1 ]; then
                    echo "The exact public URLs are not serving the current publication build." >&2
                    exit 1
                  fi

                  code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "https://minnesotapeace.com/research/ARCHITECTURE.md")
                  if [ "$code" != "404" ]; then
                    echo "Expected /research/ to remain private from the public origin; got HTTP $code" >&2
                    exit 1
                  fi
