name: Deploy to Cloudflare Pages

# Cloudflare Pages project `minnesotapeace` deploys from `main`.
# research/ stays in git as the lab and is never copied into the Pages artifact.

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            deployments: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Assemble and validate public site
              run: |
                  set -euo pipefail
                  mkdir -p public
                  cp _headers _redirects index.html 404.html robots.txt sitemap.xml favicon.svg public/
                  cp -a css js assets record status guide oversight public/
                  mkdir -p public/functions
                  cp -a functions/. public/functions/

                  test -f public/index.html
                  test -f public/css/publication.css
                  test -f public/css/deepdive.css
                  test -f public/css/discovery.css
                  test -f public/css/status.css
                  test -f public/js/discovery.js
                  test -f public/status/index.html
                  test -f public/guide/index.html
                  test -f public/oversight/index.html
                  test -f public/_headers
                  test -f public/_redirects
                  test -f public/record/index.html
                  test -f public/record/js/viewer.js
                  test -f public/record/js/briefs.js
                  test -f public/record/css/viewer.css
                  test -f public/record/css/context.css
                  test -f public/record/css/briefs.css
                  test -f public/record/data/corpus.js
                  test -f public/record/data/stats.js
                  test -f public/record/documents/25-cr-00349-ecf1.pdf
                  test -f public/functions/_middleware.js

                  if [ -e public/research ] || [ -e public/.git ] || [ -e public/.github ]; then
                    echo "lab paths leaked into the public artifact" >&2
                    exit 1
                  fi

                  if grep -R -n --include='*.html' --include='*.xml' -E '(href|src)="/research/' public; then
                    echo "public artifact still points at /research/" >&2
                    exit 1
                  fi

                  if grep -n -E 'CHARGED_ALLEGED|metric_type|overlap_group|Actor classes|v1 records|corpus bundle|Later, not now|Editorial, not a vibe' public/index.html public/record/index.html public/status/index.html public/guide/index.html public/oversight/index.html; then
                    echo "internal research vocabulary leaked into visitor-facing HTML" >&2
                    exit 1
                  fi

                  grep -Fq 'What happened' public/index.html
                  grep -Fq 'The story in 90 seconds' public/index.html
                  grep -Fq 'How the systems worked' public/index.html
                  grep -Fq 'Where things stand' public/index.html
                  grep -Fq 'Where do the cases actually stand now?' public/status/index.html
                  grep -Fq '78' public/status/index.html
                  grep -Fq '68' public/status/index.html
                  grep -Fq '26' public/status/index.html
                  grep -Fq 'Who is who' public/guide/index.html
                  grep -Fq 'Court language' public/guide/index.html
                  grep -Fq 'The fraud story is only half the story.' public/oversight/index.html
                  grep -Fq 'Legislative Auditor' public/oversight/index.html
                  grep -Fq 'Evidence room' public/record/index.html
                  grep -Fq '/record/js/briefs.js' public/record/index.html
                  grep -Fq 'Start with a case, not a data table.' public/record/js/briefs.js
                  grep -Fq 'What prosecutors allege in this filing' public/record/js/briefs.js
                  grep -Fq 'context-first-v4' public/functions/_middleware.js
                  grep -Fq '/js/discovery.js' public/functions/_middleware.js
                  grep -Fq '78 defendants had been charged' public/functions/_middleware.js

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy public --project-name minnesotapeace --branch main

            - name: Purge Cloudflare cache
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: |
                  set -euo pipefail
                  ZONE_JSON=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                    "https://api.cloudflare.com/client/v4/zones?name=minnesotapeace.com")
                  ZONE_ID=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); r=d.get("result") or []; print(r[0]["id"] if r else "")' "$ZONE_JSON")
                  if [ -z "$ZONE_ID" ]; then
                    echo "No zone id; skipping purge (Pages token may lack Zone.Cache Purge)."
                    echo "$ZONE_JSON" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin).get("errors", []), indent=2))'
                    exit 0
                  fi
                  curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
                    -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                    -H "Content-Type: application/json" \
                    --data '{"purge_everything":true}'

            - name: Verify exact public URLs serve the publication build
              run: |
                  set -euo pipefail
                  ok=0
                  for attempt in 1 2 3 4 5 6; do
                    rm -f /tmp/home.headers /tmp/record.headers /tmp/status.headers /tmp/guide.headers /tmp/oversight.headers
                    HOME=$(curl -fsSL -D /tmp/home.headers -H 'Cache-Control: no-cache' "https://minnesotapeace.com/" || true)
                    RECORD=$(curl -fsSL -D /tmp/record.headers -H 'Cache-Control: no-cache' "https://minnesotapeace.com/record/" || true)
                    STATUS=$(curl -fsSL -D /tmp/status.headers -H 'Cache-Control: no-cache' "https://minnesotapeace.com/status/" || true)
                    GUIDE=$(curl -fsSL -D /tmp/guide.headers -H 'Cache-Control: no-cache' "https://minnesotapeace.com/guide/" || true)
                    OVERSIGHT=$(curl -fsSL -D /tmp/oversight.headers -H 'Cache-Control: no-cache' "https://minnesotapeace.com/oversight/" || true)
                    BRIEFS=$(curl -fsSL -H 'Cache-Control: no-cache' "https://minnesotapeace.com/record/js/briefs.js" || true)
                    DISCOVERY=$(curl -fsSL -H 'Cache-Control: no-cache' "https://minnesotapeace.com/js/discovery.js" || true)

                    if printf '%s' "$HOME" | grep -Fq 'What happened' \
                      && printf '%s' "$HOME" | grep -Fq 'status-value">78<' \
                      && printf '%s' "$HOME" | grep -Fq '/js/discovery.js' \
                      && printf '%s' "$STATUS" | grep -Fq 'Where do the cases actually stand now?' \
                      && printf '%s' "$STATUS" | grep -Fq '78th defendant charged' \
                      && printf '%s' "$GUIDE" | grep -Fq 'Who is who' \
                      && printf '%s' "$OVERSIGHT" | grep -Fq 'The fraud story is only half the story.' \
                      && printf '%s' "$RECORD" | grep -Fq 'Evidence room' \
                      && printf '%s' "$RECORD" | grep -Fq '/record/js/briefs.js' \
                      && printf '%s' "$RECORD" | grep -Fq '/js/discovery.js' \
                      && printf '%s' "$BRIEFS" | grep -Fq 'Start with a case, not a data table.' \
                      && printf '%s' "$DISCOVERY" | grep -Fq 'Current status' \
                      && grep -qi '^x-mnpeace-publication: context-first-v4' /tmp/home.headers \
                      && grep -qi '^cache-control: .*no-store' /tmp/home.headers \
                      && grep -qi '^cache-control: .*no-store' /tmp/status.headers \
                      && grep -qi '^cache-control: .*no-store' /tmp/guide.headers \
                      && grep -qi '^cache-control: .*no-store' /tmp/oversight.headers; then
                      ok=1
                      break
                    fi
                    sleep 5
                  done

                  if [ "$ok" -ne 1 ]; then
                    echo "The exact public URLs are not serving the current publication build." >&2
                    echo "Homepage response headers:" >&2
                    cat /tmp/home.headers >&2 || true
                    exit 1
                  fi

                  code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "https://minnesotapeace.com/research/ARCHITECTURE.md")
                  if [ "$code" != "404" ]; then
                    echo "Expected /research/ to remain private from the public origin; got HTTP $code" >&2
                    exit 1
                  fi
