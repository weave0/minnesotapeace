name: Deploy to Cloudflare Pages

# Cloudflare Pages project `minnesotapeace` deploys from `main`.
# `main` is the MN Peace public site (community healing + The Record),
# not the retired Jamie Rigling mediation practice.

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            deployments: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy . --project-name minnesotapeace --branch main
