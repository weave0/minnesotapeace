name: FOF RECAP public probe

on:
  push:
    branches:
      - research/fof-recap-sentencing-probe-2026-08-29

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query public CourtListener only
        run: |
          set -euo pipefail
          echo '=== Docket HTML status ==='
          curl -A 'Mozilla/5.0 MNPeaceResearch/1.0' -L -sS -D /tmp/headers.txt -o /tmp/bock.html 'https://www.courtlistener.com/docket/65360995/united-states-v-bock/' || true
          head -n 10 /tmp/headers.txt || true
          echo '=== Relevant names/dates in public HTML ==='
          grep -Eio '.{0,120}(Abdinasir Mahamed Abshir|Abdihakim Ali Ahmed|Ahmed Abdullahi Ghedi|Ahmed Sharif Omar-Hashim|August 18, 2026|August 26, 2026|August 27, 2026|Judgment|Sentenc).{0,220}' /tmp/bock.html | tail -n 120 || true
          echo '=== Anonymous API docket status ==='
          curl -A 'MNPeaceResearch/1.0' -L -sS -w '\nHTTP_STATUS=%{http_code}\n' 'https://www.courtlistener.com/api/rest/v4/dockets/65360995/' | head -c 6000 || true
          echo
          echo '=== Anonymous API entry query status ==='
          curl -A 'MNPeaceResearch/1.0' -L -sS -w '\nHTTP_STATUS=%{http_code}\n' 'https://www.courtlistener.com/api/rest/v4/docket-entries/?docket=65360995&page_size=100&order_by=-date_filed' | head -c 12000 || true
          echo
          echo 'No PACER credentials used; no purchases performed.'
